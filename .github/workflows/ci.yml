name: CI

on:
  pull_request:
    branches: [main]

concurrency: # a new push to a PR cancels that PR's older run
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # for the grey "Skipped tests" check

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Core unit tests (no network, part of the required check)
        run: dotnet test WhereIsMyAi.RestSharpBase.Core.Tests --no-build -c Release

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://petstore.swagger.io/v2
      BUGS_REPO_PATH: ${{ github.workspace }}/Bugs # enables the open-bug skip logic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test WhereIsMyAi.PetStore.TestAutomation -c Release --logger trx --results-directory TestResults
      - name: Collect skipped tests
        if: always()
        run: |
          grep -h 'outcome="NotExecuted"' TestResults/*.trx | sed -E 's/.*testName="([^"]*)".*/\1/; s/&quot;/"/g; s/&amp;/\&/g' > skipped.txt || true
          while read -r name; do echo "::warning title=Skipped (open bug)::$name"; done < skipped.txt
      - name: Grey "Skipped tests" check
        # fork PRs get a read-only token and cannot create checks; the warnings above still show the skips
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const names = require('fs').readFileSync('skipped.txt', 'utf8').split('\n').filter(Boolean);
            if (!names.length) return;
            await github.rest.checks.create({
              ...context.repo,
              name: 'Skipped tests',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: `${names.length} tests skipped (open bugs)`, summary: names.map(n => `- ${n}`).join('\n') },
            });
